# Type check and test on every push and pull request.
#
# No secrets are involved: the LLM client is created lazily, so the whole test
# suite runs without a GEMINI_API_KEY. Anything that would need one is not
# tested here by design — a CI run must not depend on a paid external service.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned to 24 because that is the version this project is verified on.
      # The test script relies on Node expanding the "src/**/*.test.ts" glob
      # itself, which older runners do not do the same way.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly what package-lock.json pins, unlike npm install
      # which may resolve newer versions. Reproducible builds start here.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test
